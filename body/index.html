<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' file: data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riya</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="sprite-box">
      <div id="pet">
        <div id="sprite">
          <img class="layer" id="layer-a" alt="">
          <img class="layer" id="layer-b" alt="">
        </div>
      </div>
    </div>
    <canvas id="effects" aria-hidden="true"></canvas>
    <div id="activity" hidden></div>
    <div id="bubble" hidden></div>
    <div id="confirm" hidden role="alertdialog" aria-labelledby="confirm-text">
      <p id="confirm-text"></p>
      <div id="confirm-buttons">
        <button id="confirm-yes" type="button">Yes</button>
        <button id="confirm-no" type="button">No</button>
      </div>
    </div>
  </div>
  <div id="side">
    <section id="agents" class="empty" aria-label="Agents">
      <h2>Agents</h2>
      <ul id="agents-list"></ul>
      <p id="agents-empty">No agents right now.</p>
    </section>
    <section id="reminders" class="empty" aria-label="Reminders">
      <h2>Reminders</h2>
      <ul id="reminders-list"></ul>
    </section>
    <div id="log"></div>
    <form id="composer" autocomplete="off">
      <input id="input" type="text" maxlength="4000" placeholder="Say something…" aria-label="Message to Riya">
    </form>
  </div>
  <div id="agent-badge" hidden role="status"></div>
  <div id="status" hidden></div>
</div>
<script src="src/sprite-logic.js"></script>
<script src="src/hit-test.js"></script>
<script src="src/bubble.js"></script>
<script src="src/stage-logic.js"></script>
<script src="src/pet-logic.js"></script>
<script src="src/effects-logic.js"></script>
<script src="src/agents-logic.js"></script>
<script src="src/hands-logic.js"></script>
<script src="renderer.js"></script>
</body>
</html>
