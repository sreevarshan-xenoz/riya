name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (3.12)
    runs-on: ubuntu-latest
    env:
      # Local hook/websocket tests must not go through an outbound proxy.
      NO_PROXY: 127.0.0.1,localhost
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-riya.txt
      # CPU-only PyTorch: the research track's tests never need a GPU.
      - name: Install PyTorch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # Only what the test suite imports. sounddevice, pocket-tts, moonshine-voice,
      # tiktoken, datasets and mss are runtime/training extras the tests stub out;
      # no model weights are downloaded (tests/conftest.py guards fastembed and the
      # real user folders).
      - name: Install test dependencies
        run: >
          pip install
          fastapi "uvicorn[standard]" "pydantic>=2" httpx
          "fastembed==0.9.0" numpy jsonschema pillow tzdata pytest
      - name: Run the Python suite
        run: python -m pytest -q

  body:
    name: Body (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: body
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: body/package-lock.json
      # Skip Electron's binary download: the tests only need ajv.
      - name: Install test dependencies
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Run the desktop suite
        run: npm test
